# Put in each project repo at .github/workflows/deploy.yml
# Repo secrets needed (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST     the server's static IP
#   SERVER_SSH_KEY  private key whose public half is in /home/deploy/.ssh/authorized_keys

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button (redeploys the latest commit of a branch)

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name must be lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Lightsail is x86 (amd64). If you use an EC2 Graviton (t4g) instance,
          # change this to linux/arm64.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /srv/apps/${{ github.event.repository.name }}
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env
            else
              echo "IMAGE_TAG=${{ github.sha }}" >> .env
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            # Old SHA-tagged images are never dangling; -a removes them. Keep a week for rollback.
            docker image prune -af --filter until=168h
